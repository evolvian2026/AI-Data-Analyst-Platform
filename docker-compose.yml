services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-analyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_data_analyst}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Deliberately not `pg_isready -U $POSTGRES_USER`. That reports only that
      # the *server* accepts connections, and with no -d it connects to a
      # database named after the user - so it logs
      #   FATAL:  database "analyst" does not exist
      # on every probe while still exiting 0. Alarming in the log, and useless
      # as a gate: `api` waits on this condition and what it needs is the
      # application database ready to query, which pg_isready never checks.
      test: ["CMD-SHELL",
             "psql -U ${POSTGRES_USER:-analyst} -d ${POSTGRES_DB:-ai_data_analyst} -tAc 'select 1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-analyst}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_data_analyst}
      STORAGE_DIR: /app/data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      FILE_RETENTION_HOURS: ${FILE_RETENTION_HOURS:-72}
      RESULT_RETENTION_DAYS: ${RESULT_RETENTION_DAYS:-0}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-5}
      AI_ALLOW_RAW_ROWS: ${AI_ALLOW_RAW_ROWS:-false}
    volumes:
      - uploads:/app/data
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  # Removes uploaded workbooks past the retention window. The analysis results
  # stay in the database, so reports remain readable after the file is gone.
  cleanup:
    build:
      context: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-analyst}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_data_analyst}
      STORAGE_DIR: /app/data/uploads
      FILE_RETENTION_HOURS: ${FILE_RETENTION_HOURS:-72}
      RESULT_RETENTION_DAYS: ${RESULT_RETENTION_DAYS:-0}
    volumes:
      - uploads:/app/data
    depends_on:
      db: { condition: service_healthy }
    # This service shares the API image but runs the retention loop, not the
    # web server, so the image's HTTP health check can never pass here. Left
    # inherited it reports the container permanently unhealthy, which teaches
    # operators to ignore container health and makes any restart-on-unhealthy
    # policy churn it forever. Liveness is already covered by restart below.
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'while true; do python -m app.tasks.cleanup; sleep 3600; done'
    restart: unless-stopped

volumes:
  db-data:
  uploads:
